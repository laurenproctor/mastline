<?xml version="1.0" encoding="UTF-8"?>
<!--
  The still Mastline favicon: what a tab shows before hydration and anywhere
  JavaScript never runs. Browsers ignore the animation below in the tab strip,
  so the visible 32-second blink is driven from src/lib/favicon-frames.ts. The
  artwork is duplicated there; change both together.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="16 -7.5 150 150" role="img" aria-labelledby="title desc">
  <title id="title">Mastline</title>
  <desc id="desc">The Mastline monogram with a highlighter-green camera focus indicator.</desc>
  <style>
    .focus-indicator {
      transform-box: fill-box;
      transform-origin: center;
      animation: focus-blink 32s cubic-bezier(.4, 0, .2, 1) infinite;
    }

    @keyframes focus-blink {
      0%, 92%, 100% { opacity: 1; transform: scale(1); }
      93.5% { opacity: .28; transform: scale(.68); }
      95% { opacity: 1; transform: scale(1.08); }
      96.2% { opacity: .48; transform: scale(.82); }
      97.8% { opacity: 1; transform: scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .focus-indicator { animation: none; }
    }
  </style>

  <g fill="#16171A">
    <path d="M37.4 46.7c-3.2 0-6.1 1.9-7.5 4.7-.6 1.2-.9 2.5-.9 3.9v45.6c0 1.8 1.4 3.2 3.2 3.2h7.2c1.8 0 3.2-1.4 3.2-3.2V64.7l13.2 15.5c1.7 2 4.7 2.1 6.5.1l12-13.7c1.5-1.7 2.3-4 2.3-6.4V46.5L59.1 66.2 43.2 48.8c-1.5-1.4-3.5-2.1-5.8-2.1Z"/>
    <path d="M86.5 30.8c-4 0-7.3 3.3-7.3 7.3v58.6c0 4.1 3.3 7.4 7.4 7.4h61.9c2.5 0 4.5-2 4.5-4.5v-3.9c0-2.5-2-4.5-4.5-4.5H93.7V35.3c0-2.5-2-4.5-4.5-4.5h-2.7Z"/>
    <path d="M97 45.4v12.8h36.8c2.7 0 4.9 2.2 4.9 4.9V88c8-1.4 13.7-8.6 13.7-17.3v-8.9c0-9.1-7.3-16.4-16.4-16.4H97Z"/>
  </g>

  <rect class="focus-indicator" x="121.8" y="62.8" width="13.4" height="13.4" rx="2.3" fill="#89FF0A"/>
</svg>
