# TEMPORARY — delete before merge.
#
# A focused lane for stabilising the News Radar handoff and evaluation
# journeys on the runner: only those two spec files, desktop project only,
# no retries (a failure should be diagnosed from its trace, not repeated).
# Same recipe as e2e-suite.yml otherwise. Runs on push to the feature branch
# so every iteration reports in ~12 minutes instead of a full-suite hour.
name: News Radar desktop (temporary)

on:
  push:
    branches: [feature/news-radar-action-handoff]
  workflow_dispatch:

jobs:
  news-radar-desktop:
    name: News Radar desktop (temporary)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.101.0

      - name: Start the local stack
        run: supabase start

      - name: Point the app and the specs at the runner's stack
        run: |
          eval "$(supabase status -o env \
            | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=' )"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "SUPABASE_TEST_PASSWORD=mastline-dev-password"
          } > .env.local

      - name: Build the app
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run the two radar specs, desktop only
        run: npx playwright test news-radar-handoff news-radar-evaluation --project=desktop --retries=0

      - name: Keep the failure traces
        if: failure()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 3

      - name: Stop the local stack
        if: always()
        run: supabase stop --no-backup
