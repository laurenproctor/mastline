# The browser suite, on demand.
#
# The specs under e2e/ check what no amount of parsing HTML can: layouts at
# the sizes ACCEPTANCE.md names, visible focus, and client-rendered states,
# against a production build and a real local stack. Like the database suite,
# they stay out of the PR gate and exist for a development machine that cannot
# hold a healthy stack or a quiet browser run.
#
# Nothing here contacts a hosted project: `supabase start` is entirely local
# to the runner, and the only secrets used are the CLI's local development
# defaults, which are public knowledge.
#
# It runs as three parallel jobs, one per viewport project. They share nothing
# -- not a stack, not a database, not a server -- which is what makes running
# them at the same time safe despite `workers: 1` inside each.
name: E2E suite

on:
  workflow_dispatch:

jobs:
  e2e:
    name: E2E ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      # One runner per viewport project, because the specs cannot share a
      # database and so cannot share a worker. They can share nothing at all
      # instead: each job below starts its own Supabase stack, builds its own
      # app and serves its own `next start`, which is the one axis of
      # parallelism available without rewriting every fixture to be
      # worker-scoped. Three jobs at once rather than three projects in
      # sequence.
      fail-fast: false
      matrix:
        include:
          # Desktop runs every spec; tablet and mobile run only what carries
          # @responsive, and mobile also what carries @webkit. The projects in
          # playwright.config.ts hold that gate and explain it.
          - project: desktop
            browsers: chromium
          - project: tablet
            browsers: chromium
          # Two, and both are needed. The iPhone device descriptor is WebKit --
          # which is the whole reason the import queue is tagged to reach this
          # project -- but the setup project it depends on signs the seeded
          # roles in through Chromium. A saved session is a JSON file of
          # cookies and carries across engines perfectly well; the browser that
          # writes it still has to exist.
          - project: mobile
            browsers: chromium webkit
    # 45, not the 75 one sequential job needed. The heaviest single project is
    # desktop, which now carries the long journeys alone rather than behind two
    # other projects' worth of work. Per-test budgets stay CI-capped (see
    # testBudget in e2e/helpers.ts) so a failing test cannot stretch to the
    # ceiling the way an uncapped budget once did.
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          # Pinned for the same reason CI pins it: the CLI applies the
          # migrations, and an unannounced CLI change should not arrive as a
          # mystery red run.
          version: 2.101.0

      # The full local stack — database, PostgREST, GoTrue, Storage — with the
      # whole migration chain applied from empty and supabase/seed.sql loaded.
      - name: Start the local stack
        run: supabase start

      # Written before the build on purpose: `next build` inlines the
      # NEXT_PUBLIC_* values, so the app must know its Supabase before it is
      # compiled, not merely before it starts.
      - name: Point the app and the specs at the runner's stack
        run: |
          eval "$(supabase status -o env \
            | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=' )"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "SUPABASE_TEST_PASSWORD=mastline-dev-password"
          } > .env.local

      - name: Build the app
        run: npm run build

      # Only what this job actually launches. Every run used to download WebKit
      # for all three projects when two of them never open it.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browsers }}

      # The config starts `next start -p 4100` itself and refuses to reuse a
      # stray server under CI, so the build above is exactly what is tested.
      # The setup project (e2e/auth.setup.ts) is a declared dependency of every
      # viewport project, so naming one project here still signs the seeded
      # roles in first.
      - name: Run the browser suite
        run: npx playwright test --project=${{ matrix.project }}

      - name: Keep the failure traces
        if: failure()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: playwright-traces-${{ matrix.project }}
          path: test-results/
          retention-days: 7

      - name: Stop the local stack
        if: always()
        run: supabase stop --no-backup
